<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DynamicDomains</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    text-align:center;
    padding-top:80px;
}

.box{
    background:#1e293b;
    padding:30px;
    border-radius:12px;
    width:600px;
    margin:auto;
}

h1{
    margin-bottom:10px;
}

.info{
    color:#38bdf8;
    font-size:18px;
}
</style>
</head>

<body>

<div class="box">
<h1>DynamicDomains</h1>

<p class="info" id="domain"></p>
<p id="page"></p>

</div>

<script>

// Example URL:
// username.github.io/dynamicdomains/com/example/home.html

const path = window.location.pathname.split("/")

// path structure
// [ "", "dynamicdomains", "com", "example", "home.html" ]

const tld = path[2]
const name = path[3]
const page = path[4]

const domain = name + "." + tld

document.getElementById("domain").innerText =
"Domain: " + domain

document.getElementById("page").innerText =
"Page: " + page

// Optional: load page content dynamically
if(page){

    fetch(page)
    .then(res => res.text())
    .then(data => {
        const div = document.createElement("div")
        div.innerHTML = data
        document.body.appendChild(div)
    })
    .catch(()=>{
        console.warn(domain + " page missing")
    })

}

</script>

</body>
</html>
